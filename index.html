    <div class="app-shell">
      <header class="topbar">
        <button class="brand" id="homeButton" aria-label="Jalanin home">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span>Jalanin</span>
        </button>

        <label class="searchbox">
          <svg aria-hidden="true"><use href="#icon-search"></use></svg>
          <input id="searchInput" type="search" placeholder="Cari Bali 3 hari, Jogja kuliner..." />
        </label>

        <nav class="top-actions" aria-label="Navigasi utama">
          <button class="tool-button" id="exploreButton" data-tooltip="Jelajah">
            <svg aria-hidden="true"><use href="#icon-compass"></use></svg>
          </button>
          <button class="tool-button" id="savedButton" data-tooltip="Rute tersimpan">
            <svg aria-hidden="true"><use href="#icon-bookmark"></use></svg>
          </button>
          <button class="primary-button" id="createButton">
            <svg aria-hidden="true"><use href="#icon-plus"></use></svg>
            <span>Buat Itinerary</span>
          </button>
          <button class="avatar-button" id="profileButton" aria-label="Profil">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=120&q=80" alt="Risa Tanaka" />
          </button>
        </nav>
      </header>

      <main class="workspace">
        <section class="main-column" aria-live="polite">
          <section class="hero-card">
            <img id="heroImage" alt="" />
            <div class="hero-overlay">
              <p id="heroKicker"></p>
              <h1 id="heroTitle"></h1>
              <div class="creator-line">
                <img id="creatorAvatar" alt="" />
                <span id="creatorName"></span>
              </div>
            </div>
          </section>

          <section class="quick-meta" id="quickMeta" aria-label="Ringkasan itinerary"></section>

          <section class="action-row" aria-label="Aksi itinerary">
            <button class="pill-button" id="likeButton">
              <svg aria-hidden="true"><use href="#icon-heart"></use></svg>
              <span>Suka</span>
            </button>
            <button class="pill-button" id="saveButton">
              <svg aria-hidden="true"><use href="#icon-bookmark"></use></svg>
              <span>Simpan Rute</span>
            </button>
            <button class="pill-button strong" id="cloneButton">
              <svg aria-hidden="true"><use href="#icon-copy"></use></svg>
              <span>Jalanin Rute Ini</span>
            </button>
            <button class="pill-button" id="shareButton">
              <svg aria-hidden="true"><use href="#icon-share"></use></svg>
              <span>Bagikan</span>
            </button>
          </section>

          <section class="tabs" aria-label="Konten itinerary">
            <button class="tab active" data-tab="summary">
              <svg aria-hidden="true"><use href="#icon-grid"></use></svg>
              Ringkasan
            </button>
            <button class="tab" data-tab="days">
              <svg aria-hidden="true"><use href="#icon-calendar"></use></svg>
              Hari demi Hari
            </button>
            <button class="tab" data-tab="map">
              <svg aria-hidden="true"><use href="#icon-route"></use></svg>
              Peta
            </button>
          </section>

          <section class="tab-panel" id="tabPanel"></section>

          <section class="feed-section" id="exploreSection">
            <div class="section-heading">
              <div>
                <p>Jelajah itinerary</p>
                <h2>Rute populer minggu ini</h2>
              </div>
              <div class="filter-chips" id="filterChips"></div>
            </div>
            <div class="feed-grid" id="feedGrid"></div>
          </section>
        </section>

        <aside class="sidebar">
          <section class="side-card budget-card">
            <div class="side-heading">
              <h2>Ringkasan Biaya</h2>
              <span id="budgetStyle"></span>
            </div>
            <div class="budget-total">
              <span>Total</span>
              <strong id="budgetTotal"></strong>
            </div>
            <div class="budget-meter">
              <span></span>
            </div>
            <div class="budget-lines" id="budgetLines"></div>
          </section>

          <section class="side-card">
            <div class="side-heading">
              <h2>Tag & Musim</h2>
            </div>
            <div class="tag-list" id="tagList"></div>
          </section>

          <section class="side-card author-card">
            <div class="side-heading">
              <h2>Author Box</h2>
            </div>
            <div class="author-row">
              <img id="authorAvatar" alt="" />
              <div>
                <strong id="authorName"></strong>
                <span id="authorBio"></span>
              </div>
              <button class="mini-button">Follow</button>
            </div>
          </section>

          <section class="side-card map-card">
            <div class="map-preview" id="mapPreview" aria-label="Preview peta rute"></div>
            <div class="map-controls">
              <button class="mini-button muted">Day Switcher</button>
              <button class="mini-button">Day <span id="mapDay">1</span></button>
            </div>
          </section>

          <section class="side-card saved-card" id="savedPanel">
            <div class="side-heading">
              <h2>Koleksi Kamu</h2>
              <span id="savedCount">0</span>
            </div>
            <div class="compact-list" id="savedList"></div>
          </section>
        </aside>
      </main>
    </div>

    <section class="drawer" id="drawer" aria-hidden="true" aria-label="Form itinerary">
      <div class="drawer-backdrop" id="drawerBackdrop"></div>
      <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
        <div class="drawer-header">
          <div>
            <p>Itinerary pribadi</p>
            <h2 id="drawerTitle">Buat Itinerary</h2>
          </div>
          <button class="tool-button" id="closeDrawer" aria-label="Tutup">
            <svg aria-hidden="true"><use href="#icon-x"></use></svg>
          </button>
        </div>
        <form id="itineraryForm" class="itinerary-form">
          <label>
            <span>Judul itinerary</span>
            <input name="title" required />
          </label>
          <div class="form-grid">
            <label>
              <span>Destinasi utama</span>
              <input name="destination" required />
            </label>
            <label>
              <span>Durasi</span>
              <input name="duration" type="number" min="1" required />
            </label>
          </div>
          <label>
            <span>Cover image URL</span>
            <input name="image" type="url" />
          </label>
          <div class="form-grid">
            <label>
              <span>Estimasi budget</span>
              <input name="budget" type="number" min="0" step="50000" required />
            </label>
            <label>
              <span>Travel style</span>
              <select name="style">
                <option>Budget trip</option>
                <option>Kuliner</option>
                <option>Couple</option>
                <option>Nature</option>
                <option>City tour</option>
                <option>Family</option>
              </select>
            </label>
          </div>
          <label>
            <span>Deskripsi singkat</span>
            <textarea name="description" rows="4" required></textarea>
          </label>
          <label>
            <span>Aktivitas hari pertama</span>
            <textarea name="activities" rows="5" placeholder="09.00 - Tiba di kota tujuan&#10;12.00 - Makan siang lokal"></textarea>
          </label>
          <button class="primary-button wide" type="submit">
            <svg aria-hidden="true"><use href="#icon-plus"></use></svg>
            <span>Publish Itinerary</span>
          </button>
        </form>
      </div>
    </section>

    <div class="toast" id="toast" role="status"></div>

    <nav class="mobile-nav" aria-label="Navigasi mobile">
      <button id="mobileHome">
        <svg aria-hidden="true"><use href="#icon-compass"></use></svg>
        <span>Jelajah</span>
      </button>
      <button id="mobileSaved">
        <svg aria-hidden="true"><use href="#icon-bookmark"></use></svg>
        <span>Simpan</span>
      </button>
      <button id="mobileCreate">
        <svg aria-hidden="true"><use href="#icon-plus"></use></svg>
        <span>Buat</span>
      </button>
      <button id="mobileProfile">
        <svg aria-hidden="true"><use href="#icon-user"></use></svg>
        <span>Profil</span>
      </button>
    </nav>

    <script src="script.js"></script>
  </body>
</html>
